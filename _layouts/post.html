---
layout: default
---

<!-- 在文章正文上方插入更新时间 -->
{%- if page.last_modified_at -%}
  <p style="color: #586069; font-size: 0.9em; margin-bottom: 20px;">
    最后更新于：{{ page.last_modified_at | date: "%Y-%m-%d" }}
  </p>
{%- endif -%}

<!-- 渲染文章正文 -->
{{ content }}

<script>
  MathJax = {
    loader: {
      load: ['ui/lazy'],
      paths: {
        mathjax: '{{ site.baseurl }}/assets/vendor/mathjax/es5'
      }
    },
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']]
    },
    chtml: {
      fontURL: '{{ site.baseurl }}/assets/vendor/mathjax/es5/output/chtml/fonts/woff-v2'
    }
  };
</script>
<script id="MathJax-script" async src="{{ site.baseurl }}/assets/vendor/mathjax/es5/tex-mml-chtml.js"></script>

<!-- 【新增】Mermaid 渲染流程图 -->
<script type="module">
  Array.from(document.getElementsByClassName("language-mermaid")).forEach(element => {
    element.classList.add("mermaid");
  });
  
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
  mermaid.initialize({ 
    startOnLoad: true, 
    theme: 'default'
  });
</script>
